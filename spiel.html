<!DOCTYPE html>
<html lang="de">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Feuerwehrauto</title>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#8ecbf0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
  #stage{display:block;width:100%;height:100%;touch-action:manipulation}

  /* ---------- Blaulicht ---------- */
  .beacon-glow{opacity:0}
  #stage.lights-on .beacon-glass{animation:flash .5s steps(1,end) infinite}
  #stage.lights-on .beacon-glass.b2{animation-delay:.25s}
  #stage.lights-on .beacon-glow{animation:flashglow .5s steps(1,end) infinite}
  #stage.lights-on .beacon-glow.g2{animation-delay:.25s}
  @keyframes flash{0%,49%{fill:#c8ecff}50%,100%{fill:#123a6b}}
  @keyframes flashglow{0%,49%{opacity:.9}50%,100%{opacity:0}}

  /* ---------- Sirene ---------- */
  #stage.siren-on .horn{animation:hornwig .3s ease-in-out infinite alternate}
  #stage.siren-on .wave{animation:waveout .9s ease-out infinite}
  #stage.siren-on .wave.w2{animation-delay:.22s}
  #stage.siren-on .wave.w3{animation-delay:.44s}
  @keyframes hornwig{from{transform:translate(0,0)}to{transform:translate(0,-4px)}}
  @keyframes waveout{0%{opacity:.9;stroke-width:5}100%{opacity:0;stroke-width:1}}

  /* ---------- Drehleiter: hinten gelagert, ragt nach vorn ueber ---------- */
  .laddergrp{transform:translate(160px,302px) rotate(0deg);
    transition:transform 1.4s cubic-bezier(.35,.05,.2,1)}
  #stage.ladder-out .laddergrp{transform:translate(160px,302px) rotate(-48deg)}
  .seg2{transform:translate(0px,0px);transition:transform 1.4s cubic-bezier(.35,.05,.2,1)}
  #stage.ladder-out .seg2{transform:translate(220px,0px)}
  .seg3{transform:translate(0px,0px);transition:transform 1.4s cubic-bezier(.35,.05,.2,1)}
  #stage.ladder-out .seg3{transform:translate(220px,0px)}
  /* Personenkorb dreht gegen die Leiter und bleibt dadurch aufrecht */
  .basket{transform:rotate(0deg);transition:transform 1.4s cubic-bezier(.35,.05,.2,1)}
  #stage.ladder-out .basket{transform:rotate(48deg)}
  @media (orientation: landscape){
    /* Querformat: flachere Leiter, damit alles im breiten Ausschnitt bleibt */
    #stage.ladder-out .laddergrp{transform:translate(160px,302px) rotate(-24deg)}
    #stage.ladder-out .basket{transform:rotate(24deg)}
  }

  /* ---------- Wasser (sitzt im Korb, deshalb immer aufrecht) ---------- */
  .water{opacity:0;transition:opacity .25s}
  #stage.water-on .water{opacity:1}
  .jet{stroke-dasharray:20 13;animation:flow .42s linear infinite}         /* Stroemung im Strahl */
  @keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-33}}
  .jetline{transform-origin:110px -14px;animation:wobble 1s ease-in-out infinite alternate}
  @keyframes wobble{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
  .mist{animation:mist .8s ease-in-out infinite alternate}                 /* Spruehnebel atmet */
  @keyframes mist{from{opacity:.3;transform:translate(0,0)}
                  to{opacity:.85;transform:translate(10px,-7px)}}
  .spraydrop{animation:fall 1.15s linear infinite}                         /* Tropfen fallen ab */
  @keyframes fall{0%{opacity:0;transform:translate(0,0)}
                  12%{opacity:.95}
                  100%{opacity:0;transform:translate(6px,140px)}}
  .waterzone{pointer-events:none}
  #stage.ladder-out .waterzone{pointer-events:all}

  /* ---------- Personen ---------- */
  #stage.figure-on .groundfig .step{animation:step 1.05s ease-in-out infinite alternate}
  @keyframes step{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
  #stage.figure-on .groundfig .body{animation:walkbob .52s ease-in-out infinite alternate}
  @keyframes walkbob{from{transform:translate(0,0)}to{transform:translate(0,-5px)}}
  #stage.figure-on .groundfig .arm{animation:wave .55s ease-in-out infinite alternate}
  #stage.ladder-out .basket .arm{animation:wave .6s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}

  /* Rollo offen + Maennchen angetippt: Schlauch von der Rolle nehmen, dabei stehen bleiben */
  #stage.figure-on.shutter-open .groundfig .step{animation:none}
  #stage.figure-on.shutter-open .groundfig .body{animation:hosesway 1.3s ease-in-out infinite alternate}
  @keyframes hosesway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
  #stage.figure-on.shutter-open .groundfig .arm{animation:none;transform:rotate(10deg)}
  #stage.figure-on.shutter-open .groundfig .armdown{animation:hosehand .85s ease-in-out infinite alternate}
  @keyframes hosehand{from{transform:rotate(-7deg)}to{transform:rotate(5deg)}}
  .hose{opacity:0;transition:opacity .35s}
  #stage.figure-on.shutter-open .hose{opacity:1}

  /* ---------- Fahrertuer ----------
     Scharnier an der Vorderkante (804/379). Die Tuer schwenkt zum Betrachter heraus:
     sie verkuerzt sich, bleibt dabei aber aufrecht (keine Drehung). */
  /* Geschlossen: unveraendert an ihrem Platz (Verschiebung hebt sich auf) */
  .door{transform:translate(806px,379px) scale(1,1) translate(-806px,-379px);
        transition:transform .65s cubic-bezier(.4,.05,.25,1)}
  /* Offen: Tuer schwingt am vorderen Scharnier (804) nach vorn, bleibt aufrecht, Griff hinten */
  #stage.door-open .door{transform:translate(804px,379px) scale(.44,1) translate(-804px,-379px)}
  /* Scharniere sind nur bei geschlossener Tuer am Rahmen zu sehen */
  .door .hinge{opacity:1;transition:opacity .3s}
  #stage.door-open .door .hinge{opacity:0}
  /* Tuerkante: bei offener Tuer dunkle Innenseite andeuten */
  .door .inner{opacity:0;transition:opacity .4s}
  #stage.door-open .door .inner{opacity:1}
  /* Kante der geoeffneten Tuer: heller Streifen macht den Schwenk sichtbar */
  .door .edge{opacity:0;transition:opacity .4s}
  #stage.door-open .door .edge{opacity:.85}
  /* Lichtkegel: die Tuer wirft Schatten in die Kabine */
  .doorlight{opacity:0;transition:opacity .5s}
  #stage.door-open .doorlight{opacity:1}

  /* ---------- Geräteraum ---------- */
  .shutter{transform:translate(0px,0px);transition:transform .95s cubic-bezier(.3,.1,.2,1)}
  #stage.shutter-open .shutter{transform:translate(0px,-108px)}

  /* ---------- Scheinwerfer ---------- */
  .beam{opacity:0;transition:opacity .35s}
  .lamp{transition:fill .25s}
  #stage.headlight-on .beam{opacity:.8}
  #stage.headlight-on .lamp{fill:#fffbdc}

  /* ---------- Fahren ---------- */
  /* Rad läuft in der Gruppe, die auf seinen Mittelpunkt verschoben ist -> dreht um sich selbst */
  #stage.driving .wheel .spin{animation:spin .55s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  #stage.driving .dashes{animation:scrollroad 1.1s linear infinite}
  @keyframes scrollroad{from{transform:translate(0,0)}to{transform:translate(-400px,0)}}
  #stage.driving #truck{animation:bob .5s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translate(0,0)}to{transform:translate(0,-4px)}}

  /* ---------- Hinweise ---------- */
  #hints{opacity:0;transition:opacity .6s;pointer-events:none}
  .hint-ring{fill:none;stroke:#ffffff;stroke-width:8;animation:hintpulse 1.2s ease-in-out infinite}
  .hint-dot{fill:#ffffff;animation:hintpulse 1.2s ease-in-out infinite}
  @keyframes hintpulse{0%,100%{opacity:.12}50%{opacity:.92}}

  /* ---------- Ton-Knopf ---------- */
  #mute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));
    width:48px;height:48px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.45);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer}
  #mute:active{transform:scale(.92)}
  #mute svg{width:27px;height:27px}
</style>
</head>

<script>
(function(){
  'use strict';
  var stage = document.getElementById('stage');
  var hints = document.getElementById('hints');
  var muteBtn = document.getElementById('mute');
  var SVGNS = 'http://www.w3.org/2000/svg';

  /* ================= ANSICHT (jeder Bildschirm wird ausgefüllt) ================= */
  var GROUND = 520, TRUCK_CX = 509;
  function fit(){
    var w0 = window.innerWidth, h0 = window.innerHeight;
    if (!w0 || !h0) return;
    var ar = Math.max(0.25, w0 / h0);
    var w, h, vy, vx;
    // Inhalt = Fahrzeug + Leiter samt Korb + Wasserstrahl + Figuren
    var x0, x1, y0, y1;
    if (h0 >= w0){
      x0 = -40; x1 = 1290; y0 = -560; y1 = 660;    // Leiter steil (-48 Grad)
    } else {
      x0 = -120; x1 = 1420; y0 = -300; y1 = 660;   // Leiter flacher (-24 Grad)
    }
    w = Math.max(x1 - x0, (y1 - y0) * ar);
    h = w / ar;
    if (h < y1 - y0){ h = y1 - y0; w = h * ar; }   // sehr breite Fenster
    vx = (x0 + x1) / 2 - w/2;
    vy = Math.min(GROUND - h * 0.84, y0 - 20);     // Boden bei 84 %, Korb bleibt sichtbar
    stage.setAttribute('viewBox', vx.toFixed(1) + ' ' + vy.toFixed(1) + ' ' +
                                   w.toFixed(1) + ' ' + h.toFixed(1));
  }
  fit();
  window.addEventListener('resize', function(){ fit(); if (hints.childNodes.length) renderHints(); });
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 250); });

  /* ================= TON ================= */
  var AC = null, master = null, muted = false;
  var loops = { water: null, drive: null };
  var siren = { on:false, osc:null, g:null, timer:null, hi:false };

  function unlockAudio(){
    if (!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended' && AC.resume) AC.resume();
  }
  function nbuf(sec){
    var n = Math.max(1, Math.floor(AC.sampleRate * sec));
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function beep(f, dur, vol){
    if (!AC) return;
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function sweep(o){
    if (!AC) return;
    var t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = nbuf(o.dur);
    f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, o.f1), t + o.dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + o.dur + 0.05);
  }
  function sfxWhirr(){
    if (!AC) return;
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = 4;
    o.frequency.setValueAtTime(72, t); o.frequency.linearRampToValueAtTime(138, t + 1.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.085, t + 0.2);
    g.gain.setValueAtTime(0.085, t + 1.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.45);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 1.5);
    sweep({ f0: 1600, f1: 420, dur: 1.25, vol: 0.045, q: 0.9 });
    setTimeout(function(){ sweep({ f0: 900, f1: 150, dur: 0.1, vol: 0.13, q: 1 }); }, 1240);
  }
  function sfxDoor(open){
    sweep({ f0: open ? 320 : 700, f1: open ? 900 : 260, dur: 0.45, vol: 0.06, q: 2 });
    setTimeout(function(){ sweep({ f0: 640, f1: 140, dur: 0.1, vol: 0.13, q: 1 }); }, open ? 380 : 300);
  }
  function sfxRoll(){
    for (var i = 0; i < 8; i++){
      (function(i){
        setTimeout(function(){ sweep({ f0: 800 + i * 60, f1: 380, dur: 0.07, vol: 0.055, q: 1.4 }); }, i * 76);
      })(i);
    }
    setTimeout(function(){ sweep({ f0: 560, f1: 130, dur: 0.12, vol: 0.13, q: 1 }); }, 660);
  }
  function sirenStart(){
    if (!AC || siren.on) return;
    siren.on = true; siren.hi = false;
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 440;
    f.type = 'lowpass'; f.frequency.value = 1700; f.Q.value = 1;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.11, t + 0.25);
    o.connect(f); f.connect(g); g.connect(master); o.start(t);
    siren.osc = o; siren.g = g;
    siren.timer = setInterval(function(){
      if (!AC || !siren.osc) return;
      siren.hi = !siren.hi;
      var tt = AC.currentTime, cur = siren.osc.frequency.value;
      siren.osc.frequency.cancelScheduledValues(tt);
      siren.osc.frequency.setValueAtTime(cur, tt);
      siren.osc.frequency.linearRampToValueAtTime(siren.hi ? 587 : 440, tt + 0.22);
    }, 640);
  }
  function sirenStop(){
    if (!siren.on) return;
    siren.on = false;
    clearInterval(siren.timer); siren.timer = null;
    var o = siren.osc, g = siren.g;
    siren.osc = null; siren.g = null;
    if (!AC || !o) return;
    var t = AC.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.2);
    try { o.stop(t + 0.25); } catch (e) {}
  }
  function waterStart(){
    if (!AC || loops.water) return;
    var t = AC.currentTime;
    var s = AC.createBufferSource(); s.buffer = nbuf(2); s.loop = true;
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 0.7;
    var g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.1, t + 0.2);
    var lfo = AC.createOscillator(); lfo.frequency.value = 0.4;
    var lg = AC.createGain(); lg.gain.value = 450;
    lfo.connect(lg); lg.connect(f.frequency);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); lfo.start(t);
    loops.water = { s:s, g:g, lfo:lfo };
  }
  function waterStop(){
    if (!loops.water || !AC) return;
    var w = loops.water, t = AC.currentTime;
    loops.water = null;
    w.g.gain.cancelScheduledValues(t);
    w.g.gain.setValueAtTime(w.g.gain.value, t);
    w.g.gain.linearRampToValueAtTime(0.0001, t + 0.15);
    try { w.s.stop(t + 0.2); w.lfo.stop(t + 0.2); } catch (e) {}
  }
  function driveStart(){
    if (!AC || loops.drive) return;
    var t = AC.currentTime;
    var s = AC.createBufferSource(); s.buffer = nbuf(2); s.loop = true;
    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    var g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.3);
    s.connect(lp); lp.connect(g); g.connect(master);
    var o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 56;
    var of = AC.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 190;
    var og = AC.createGain(); og.gain.setValueAtTime(0.0001, t);
    og.gain.linearRampToValueAtTime(0.05, t + 0.3);
    o.connect(of); of.connect(og); og.connect(master);
    s.start(t); o.start(t);
    loops.drive = { s:s, g:g, o:o, og:og };
  }
  function driveStop(){
    if (!loops.drive || !AC) return;
    var d = loops.drive, t = AC.currentTime;
    loops.drive = null;
    [d.g, d.og].forEach(function(g){
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.25);
    });
    try { d.s.stop(t + 0.3); d.o.stop(t + 0.3); } catch (e) {}
  }

  /* ================= SCHALTEN ================= */
  var state = { ladder:false, lights:false, siren:false, door:false,
                shutter:false, headlights:false, drive:false, water:false, figure:false };
  var cls = { ladder:'ladder-out', lights:'lights-on', siren:'siren-on', door:'door-open',
              shutter:'shutter-open', headlights:'headlight-on', drive:'driving', water:'water-on',
              figure:'figure-on' };

  function toggle(key){
    var on = state[key] = !state[key];
    stage.classList.toggle(cls[key], on);
    switch (key){
      case 'ladder':
        sfxWhirr();
        if (!on && state.water){                       // Leiter eingefahren = Wasser aus
          state.water = false; stage.classList.remove('water-on'); waterStop();
        }
        break;
      case 'lights': beep(on ? 1180 : 640, 0.08, 0.05); break;
      case 'siren': if (on) sirenStart(); else sirenStop(); break;
      case 'door': sfxDoor(on); break;
      case 'shutter': sfxRoll(); break;
      case 'headlights': beep(on ? 760 : 520, 0.07, 0.05); break;
      case 'figure':
        if (on){
          if (state.shutter){                        // Rollo offen: Schlauch von der Rolle nehmen
            sweep({ f0: 1500, f1: 260, dur: 0.38, vol: 0.085, q: 1.2 });
            setTimeout(function(){ beep(760, 0.09, 0.05); }, 300);
          } else { beep(880, 0.09, 0.05); setTimeout(function(){ beep(1320, 0.12, 0.045); }, 130); }
        } else beep(660, 0.09, 0.045);
        break;
      case 'drive': if (on) driveStart(); else driveStop(); break;
      case 'water':
        if (on){
          waterStart();
          if (!state.ladder){                          // ohne ausgefahrene Leiter geht das nicht
            state.ladder = true; stage.classList.add('ladder-out'); sfxWhirr();
          }
        } else waterStop();
        break;
    }
  }

  function targetOf(node){
    while (node && node !== stage){
      if (node.getAttribute && node.getAttribute('data-toggle')) return node;
      node = node.parentNode;
    }
    return null;
  }
  function onPress(e){
    if (e.target === muteBtn) return;
    unlockAudio();
    scheduleIdle();
    var el = targetOf(e.target);
    if (!el) return;
    if (e.cancelable) e.preventDefault();
    toggle(el.getAttribute('data-toggle'));
  }
  if (window.PointerEvent) stage.addEventListener('pointerdown', onPress, { passive:false });
  else {
    stage.addEventListener('touchstart', function(e){
      var t = e.changedTouches && e.changedTouches[0];
      onPress({ target: t && document.elementFromPoint(t.clientX, t.clientY), cancelable:true,
                preventDefault: function(){ e.preventDefault(); } });
    }, { passive:false });
    stage.addEventListener('mousedown', onPress, { passive:false });
  }
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

  /* ================= HINWEIS-RINGE (verschwinden beim ersten Tippen) ================= */
  // Bildschirmkoordinaten -> SVG-Koordinaten (berücksichtigt CSS-Transformationen)
  function toSvg(clientX, clientY){
    var q = stage.createSVGPoint();
    q.x = clientX; q.y = clientY;
    return q.matrixTransform(stage.getScreenCTM().inverse());
  }
  function renderHints(){
    while (hints.firstChild) hints.removeChild(hints.firstChild);
    var seen = [];
    var list = document.querySelectorAll('[data-hint]');
    for (var i = 0; i < list.length; i++){
      var el = list[i];
      if (getComputedStyle(el).pointerEvents === 'none') continue;   // gerade nicht tippbar
      var r = el.getBoundingClientRect();                            // echte Lage inkl. Animation
      if (!r || r.width < 8 || r.height < 8) continue;
      var q = toSvg(r.x + r.width / 2, r.y + r.height / 2);
      var dup = false;
      for (var j = 0; j < seen.length; j++){
        var box = seen[j].box;
        if (Math.hypot(seen[j].x - q.x, seen[j].y - q.y) < 100){ dup = true; break; }
      }
      if (dup) continue;
      seen.push({ x:q.x, y:q.y, box:[r.x, r.y, r.x + r.width, r.y + r.height] });
    }
    seen.forEach(function(h){
      var c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('class', 'hint-ring');
      c.setAttribute('cx', h.x); c.setAttribute('cy', h.y); c.setAttribute('r', 54);
      hints.appendChild(c);
      var d = document.createElementNS(SVGNS, 'circle');
      d.setAttribute('class', 'hint-dot');
      d.setAttribute('cx', h.x); d.setAttribute('cy', h.y); d.setAttribute('r', 13);
      hints.appendChild(d);
    });
  }
  var hintTimer = null, idleTimer = null;
  function showHints(ms){
    renderHints();
    hints.style.opacity = '1';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ hints.style.opacity = '0'; }, ms || 8000);
  }
  function scheduleIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ showHints(7000); }, 25000);
  }
  setTimeout(function(){ showHints(9000); }, 1300);
  scheduleIdle();

  /* ================= TON-KNOPF ================= */
  muteBtn.addEventListener('click', function(e){
    e.stopPropagation();
    unlockAudio();
    muted = !muted;
    if (master && AC) master.gain.setTargetAtTime(muted ? 0 : 0.6, AC.currentTime, 0.05);
    muteBtn.setAttribute('aria-label', muted ? 'Ton an' : 'Ton aus');
    muteBtn.querySelector('.slash').style.display = muted ? '' : 'none';
    muteBtn.querySelector('.snd1').style.display = muted ? 'none' : '';
    muteBtn.querySelector('.snd2').style.display = muted ? 'none' : '';
  });
})();
</script>
</body>
</html>
