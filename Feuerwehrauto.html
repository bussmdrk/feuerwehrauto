<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feuerwehrauto">
<meta name="theme-color" content="#7ec1ef">
<title>Feuerwehrauto</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#8ecbf0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
  #stage{display:block;width:100%;height:100%;touch-action:manipulation}

  /* ---------- Blaulicht ---------- */
  .beacon-glow{opacity:0}
  #stage.lights-on .beacon-glass{animation:flash .5s steps(1,end) infinite}
  #stage.lights-on .beacon-glass.b2{animation-delay:.25s}
  #stage.lights-on .beacon-glow{animation:flashglow .5s steps(1,end) infinite}
  #stage.lights-on .beacon-glow.g2{animation-delay:.25s}
  @keyframes flash{0%,49%{fill:#c8ecff}50%,100%{fill:#123a6b}}
  @keyframes flashglow{0%,49%{opacity:.9}50%,100%{opacity:0}}

  /* ---------- Sirene ---------- */
  #stage.siren-on .horn{animation:hornwig .3s ease-in-out infinite alternate}
  #stage.siren-on .wave{animation:waveout .9s ease-out infinite}
  #stage.siren-on .wave.w2{animation-delay:.22s}
  #stage.siren-on .wave.w3{animation-delay:.44s}
  @keyframes hornwig{from{transform:translate(0,0)}to{transform:translate(0,-4px)}}
  @keyframes waveout{0%{opacity:.9;stroke-width:5}100%{opacity:0;stroke-width:1}}

  /* ---------- Drehleiter: hinten gelagert, ragt nach vorn ueber ---------- */
  .laddergrp{transform:translate(160px,302px) rotate(0deg);
    transition:transform 1.4s cubic-bezier(.35,.05,.2,1)}
  #stage.ladder-out .laddergrp{transform:translate(160px,302px) rotate(-64deg)}
  .seg2{transform:translate(0px,0px);transition:transform 1.4s cubic-bezier(.35,.05,.2,1)}
  #stage.ladder-out .seg2{transform:translate(220px,0px)}
  .seg3{transform:translate(0px,0px);transition:transform 1.4s cubic-bezier(.35,.05,.2,1)}
  #stage.ladder-out .seg3{transform:translate(220px,0px)}
  /* Personenkorb dreht gegen die Leiter und bleibt dadurch aufrecht */
  .basket{transform:rotate(0deg);transition:transform 1.4s cubic-bezier(.35,.05,.2,1)}
  #stage.ladder-out .basket{transform:rotate(64deg)}
  @media (orientation: landscape){
    /* Querformat: flachere Leiter, damit alles im breiten Ausschnitt bleibt */
    #stage.ladder-out .laddergrp{transform:translate(160px,302px) rotate(-40deg)}
    #stage.ladder-out .basket{transform:rotate(40deg)}
  }

  /* ---------- Wasser (sitzt im Korb, deshalb immer aufrecht) ---------- */
  .water{opacity:0;transition:opacity .25s}
  #stage.water-on .water{opacity:1}
  .jet{stroke-dasharray:20 13;animation:flow .42s linear infinite}         /* Stroemung im Strahl */
  @keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-33}}
  .jetline{transform-origin:110px -14px;animation:wobble 1s ease-in-out infinite alternate}
  @keyframes wobble{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
  .mist{animation:mist .8s ease-in-out infinite alternate}                 /* Spruehnebel atmet */
  @keyframes mist{from{opacity:.3;transform:translate(0,0)}
                  to{opacity:.85;transform:translate(10px,-7px)}}
  .spraydrop{animation:fall 1.15s linear infinite}                         /* Tropfen fallen ab */
  @keyframes fall{0%{opacity:0;transform:translate(0,0)}
                  12%{opacity:.95}
                  100%{opacity:0;transform:translate(6px,140px)}}
  .waterzone{pointer-events:none}
  #stage.ladder-out .waterzone{pointer-events:all}

  /* ---------- Personen ----------
     Grundhaltung: steht still und haelt sich am Wagen fest (Grip-Arm sichtbar).
     figure-on = winkt/laeuft, figure-on+shutter-open = haelt den Schlauch. */
  .groundfig .arm{opacity:0;transition:opacity .3s}
  #stage.figure-on .groundfig .arm{opacity:1}
  #stage.figure-on.shutter-open .groundfig .arm{opacity:0}
  .groundfig .grip{opacity:1;transition:opacity .3s}
  #stage.figure-on .groundfig .grip{opacity:0}

  /* ---------- Fahr-Sperre ---------- */
  #stage.nope #truck{animation:nope .5s ease-in-out}
  @keyframes nope{0%,100%{transform:translate(0,0)}
                  15%{transform:translate(-7px,0)}45%{transform:translate(7px,0)}
                  75%{transform:translate(-4px,0)}}
  #warn{opacity:0;transition:opacity .25s;pointer-events:none}
  .warn-ring{fill:none;stroke:#ffe600;stroke-width:11;animation:warnpulse .55s ease-in-out infinite}
  .warn-dark{stroke:#6b0000;stroke-width:7;animation:warnpulse .55s ease-in-out infinite}
  @keyframes warnpulse{0%,100%{opacity:.35}50%{opacity:1}}
  #stage.figure-on .groundfig .step{animation:step 1.05s ease-in-out infinite alternate}
  @keyframes step{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
  #stage.figure-on .groundfig .body{animation:walkbob .52s ease-in-out infinite alternate}
  @keyframes walkbob{from{transform:translate(0,0)}to{transform:translate(0,-5px)}}
  #stage.figure-on .groundfig .arm{animation:wave .55s ease-in-out infinite alternate}
  #stage.ladder-out .basket .arm{animation:wave .6s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}

  /* Rollo offen + Maennchen angetippt: Schlauch von der Rolle nehmen, dabei stehen bleiben */
  #stage.figure-on.shutter-open .groundfig .step{animation:none}
  #stage.figure-on.shutter-open .groundfig .body{animation:hosesway 1.3s ease-in-out infinite alternate}
  @keyframes hosesway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
  /* rechter Arm haengt ruhig, linker Arm haelt das Strahlrohr nach hinten */
  #stage.figure-on.shutter-open .groundfig .arm{animation:none;transform:rotate(172deg)}
  #stage.figure-on.shutter-open .groundfig .armdown{animation:none;transform:rotate(80deg)}
  .hose{opacity:0;transition:opacity .35s}
  #stage.figure-on.shutter-open .hose{opacity:1}
    .hosedrop{animation:hosefall 1.1s linear infinite}          /* Tropfen fallen nach unten */
  @keyframes hosefall{0%{opacity:0;transform:translate(0,0)}
                      14%{opacity:.95}
                      100%{opacity:0;transform:translate(4px,150px)}}

  /* ---------- Fahrertuer ----------
     Scharnier an der Vorderkante (804/379). Die Tuer schwenkt zum Betrachter heraus:
     sie verkuerzt sich, bleibt dabei aber aufrecht (keine Drehung). */
  /* Geschlossen: unveraendert an ihrem Platz (Verschiebung hebt sich auf) */
  .door{transform:translate(806px,379px) scale(1,1) translate(-806px,-379px);
        transition:transform .65s cubic-bezier(.4,.05,.25,1)}
  /* Offen: Tuer schwingt am vorderen Scharnier (804) nach vorn, bleibt aufrecht, Griff hinten */
  #stage.door-open .door{transform:translate(804px,379px) scale(.44,1) translate(-804px,-379px)}
  /* Scharniere sind nur bei geschlossener Tuer am Rahmen zu sehen */
  .door .hinge{opacity:1;transition:opacity .3s}
  #stage.door-open .door .hinge{opacity:0}
  /* Tuerkante: bei offener Tuer dunkle Innenseite andeuten */
  .door .inner{opacity:0;transition:opacity .4s}
  #stage.door-open .door .inner{opacity:1}
  /* Kante der geoeffneten Tuer: heller Streifen macht den Schwenk sichtbar */
  .door .edge{opacity:0;transition:opacity .4s}
  #stage.door-open .door .edge{opacity:.85}
  /* Lichtkegel: die Tuer wirft Schatten in die Kabine */
  .doorlight{opacity:0;transition:opacity .5s}
  #stage.door-open .doorlight{opacity:1}

  /* ---------- Geräteraum ---------- */
  .shutter{transform:translate(0px,0px);transition:transform .95s cubic-bezier(.3,.1,.2,1)}
  #stage.shutter-open .shutter{transform:translate(0px,-108px)}

  /* ---------- Scheinwerfer ---------- */
  .beam{opacity:0;transition:opacity .35s}
  .lamp{transition:fill .25s}
  #stage.headlight-on .beam{opacity:.8}
  #stage.headlight-on .lamp{fill:#fffbdc}

  /* ---------- Nacht: Scheinwerfer an = es wird dunkel ---------- */
  #night{opacity:0;transition:opacity .9s}
  #stage.headlight-on #night{opacity:1}
  /* Nachtschleier und beleuchtete Fenster stecken in der Scrollgruppe */
  #nightveil{opacity:0;transition:opacity .9s}
  #stage.headlight-on #nightveil{opacity:1}
  #litwin{opacity:0;transition:opacity .9s}
  #stage.headlight-on #litwin{opacity:1}
  /* im Dunkeln leuchten Lampen und Blaulicht kraeftiger */
  #stage.headlight-on .beam{opacity:1}
  #stage.headlight-on .lamp{fill:#fffde8}
  #stage.headlight-on .lightpool{opacity:.55}
  #night .twinkle{animation:twinkle 2.4s ease-in-out infinite alternate}
  #night .twinkle:nth-child(2){animation-delay:.6s}
  #night .twinkle:nth-child(3){animation-delay:1.2s}
  #night .twinkle:nth-child(4){animation-delay:1.8s}
  @keyframes twinkle{from{opacity:.25}to{opacity:1}}
  /* Lichtschein auf der Strasse */
  .lightpool{opacity:0;transition:opacity .6s}

  /* ---------- Fahren ---------- */
  /* Rad läuft in der Gruppe, die auf seinen Mittelpunkt verschoben ist -> dreht um sich selbst */
  #stage.driving .wheel .spin{animation:spin .55s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  #stage.driving .dashes{animation:scrollroad 1.1s linear infinite}
  @keyframes scrollroad{from{transform:translate(0,0)}to{transform:translate(-400px,0)}}
  /* Die Landschaft wird per JS-Transition bewegt (siehe landRun/landFreeze),
     damit Anhalten und Weiterfahren an jeder Stelle funktionieren. */
  #stage.driving #truck{animation:bob .5s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translate(0,0)}to{transform:translate(0,-4px)}}

  /* ---------- Hinweise ---------- */
  #hints{opacity:0;transition:opacity .6s;pointer-events:none}
  .hint-ring{fill:none;stroke:#ffffff;stroke-width:8;animation:hintpulse 1.2s ease-in-out infinite}
  .hint-dot{fill:#ffffff;animation:hintpulse 1.2s ease-in-out infinite}
  @keyframes hintpulse{0%,100%{opacity:.12}50%{opacity:.92}}

  /* ---------- Ton-Knopf ---------- */
  #mute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));
    width:48px;height:48px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.45);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer}
  #mute:active{transform:scale(.92)}
  #mute svg{width:27px;height:27px}
  /* ---------- Fahrtrichtung ----------
     Auf der Rueckfahrt dreht sich der Wagen (Spiegelung um die Radmitte).
     Die Tippflaechen bleiben ungespiegelt und damit erreichbar. */

  /* ---------- Braende ----------
     Zwei Brandstellen: die Tanne loescht das Maennchen am Heck mit dem Schlauch,
     das Hochhaus wird von oben mit der Drehleiter geloescht. */
  .flames{transition:opacity .5s}
  #stage.fireA-out #nachtA.flames, #stage.fireB-out #nachtB.flames{opacity:0}
  .fireglow{transition:opacity .6s;animation:firepulse 1.05s ease-in-out infinite alternate}
  #stage.fireA-out #nachtA .fireglow, #stage.fireB-out #nachtB .fireglow{opacity:0;animation:none}
  /* Bei Nacht strahlt das Feuer: der zusaetzliche Schein und der
     Lichtkegel auf der Strasse erscheinen nur im Dunkeln. */
  .feuerhalo{opacity:0;transition:opacity .9s;animation:feuerpuls 1.6s ease-in-out infinite alternate;
    transform-box:fill-box;transform-origin:center}   /* pulsiert um die eigene Mitte */
  .feuerschein{opacity:0;transition:opacity .9s}
  #stage.headlight-on .feuerhalo{opacity:1}
  #stage.headlight-on .feuerschein{opacity:1}
  #stage.fireA-out .feuerhalo, #stage.fireB-out .feuerhalo,
  #stage.fireA-out .feuerschein, #stage.fireB-out .feuerschein{opacity:0!important}
  @keyframes feuerpuls{from{opacity:.72;transform:scale(.97)}to{opacity:1;transform:scale(1.04)}}
  @keyframes firepulse{from{opacity:.45}to{opacity:.95}}
  .tongue{transform-origin:0 0;animation:flick .38s ease-in-out infinite alternate}
  .tongue.t2{animation-delay:.07s}.tongue.t3{animation-delay:.13s}
  .tongue.t4{animation-delay:.19s}.tongue.t5{animation-delay:.25s}
  @keyframes flick{from{transform:scale(.9,1.06) skewX(-5deg)}to{transform:scale(1.08,.92) skewX(5deg)}}
  .smoke circle{animation:smokerise 3.4s linear infinite}
  .smoke circle.s2{animation-delay:.85s}.smoke circle.s3{animation-delay:1.7s}
  .smoke circle.s4{animation-delay:2.55s}
  @keyframes smokerise{0%{opacity:0;transform:translate(0,0) scale(.55)}
                       18%{opacity:.45}
                       100%{opacity:0;transform:translate(-70px,-300px) scale(1.9)}}
  /* Nach dem Loeschen: Dampf statt Flammen */
  .steam{opacity:0;transition:opacity .4s}
  #stage.fireA-out #fireA .steam, #stage.fireB-out #fireB .steam{opacity:1}
  .steam circle{animation:steamup 2.6s ease-out infinite}
  .steam circle.v2{animation-delay:.6s}.steam circle.v3{animation-delay:1.2s}
  @keyframes steamup{0%{opacity:.75;transform:translate(0,0) scale(.6)}
                     100%{opacity:0;transform:translate(-40px,-200px) scale(1.8)}}
  /* Hinweisring an der Stelle, die jetzt dran ist */
  .firehint{fill:none;stroke:#fff;stroke-width:9;animation:hintpulse 1s ease-in-out infinite}
  /* Tippbereich am Strahl: erst tippbar, wenn der Schlauch in der Hand ist */
  #hosehit{pointer-events:none}
  #stage.figure-on.shutter-open #hosehit{pointer-events:all}
  /* Der Strahl kommt erst, wenn er am Heck aufgedreht wird */
  .hosewater{opacity:0;transition:opacity .3s}
  #stage.hosewater-on .hosewater{opacity:1}

  /* ---------- Rettung: die Katze im Baum ----------
     katzesitz  = wo die Katze ist (Baumast oder Korb), wird per JS gesetzt
     katzehide  = verkrochen, wenn die Wasserdüse laeuft
     katze-weg  = gerettet und weggelaufen */
  #katze{transition:transform .9s cubic-bezier(.4,.05,.25,1)}
  .katzschatten{transition:opacity .4s}
  #stage.katze-springt #katze2 .katzschatten{opacity:0}
  /* Verkrochen: kleiner und hoeher in der Krone, deutlich schmaler */
  .katzehide{transition:transform .45s cubic-bezier(.4,.05,.25,1), opacity .35s}
  #stage.katze-versteckt .katzehide{transform:translate(26px,-46px) scale(.62)}
  /* Im Korb: die Katze sitzt still */
  #stage.katze-korb #katze{transition:transform .9s cubic-bezier(.4,.05,.25,1)}
  /* Rausgesprungen: aus dem Korb auf die Strasse fallen, dann weglaufen.
     Die Bewegung liegt auf dem INNEREN .katzehide: die aeussere Gruppe
     traegt die Position als SVG-Attribut, eine Animation auf transform
     wuerde sie ueberschreiben. Gerechnet wird sie im Skript
     (katzeSpringtRaus) - die Fallhoehe haengt davon ab, wie hoch der
     Korb gerade steht, und der steht im Querformat ganz anders. */

  /* Zweite Katze: sitzt IM Korb (Kind von .basket) und faehrt mit ihm */
  #katze2{opacity:0;transition:opacity .2s}
  #stage.katze-korb #katze2,
  #stage.katze-springt #katze2,
  #stage.katze-laeuft #katze2{opacity:1}
  #stage.katze-weg #katze2{opacity:0;transition:opacity .3s}

  /* Die Katze in der Baumkrone ist ab dem Einsteigen nicht mehr zu sehen:
     sonst taucht sie waehrend des Sprungs wieder im Baum auf. */
  #stage.katze-korb #katze,
  #stage.katze-springt #katze,
  #stage.katze-laeuft #katze,
  #stage.katze-weg #katze{opacity:0}
  /* Tippbereich der Katze: nur waehrend der Rettung aktiv */
  #katzehit{pointer-events:none}
  #stage.katze-wartet #katzehit{pointer-events:all}
</style>
</head>
<body>

<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="-51 -1197 1120 2424" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="skyG" gradientUnits="userSpaceOnUse" x1="0" y1="-3200" x2="0" y2="520">
      <stop offset="0" stop-color="#2f86d6"/><stop offset=".55" stop-color="#7ec1ef"/><stop offset="1" stop-color="#dcf2ff"/>
    </linearGradient>
    <linearGradient id="roadG" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="0" y2="1600">
      <stop offset="0" stop-color="#79828c"/><stop offset=".22" stop-color="#5b646d"/><stop offset="1" stop-color="#2f363d"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8ff"/><stop offset="1" stop-color="#8dc6e6"/>
    </linearGradient>
    <linearGradient id="redG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f23a42"/><stop offset="1" stop-color="#b6121c"/>
    </linearGradient>
    <linearGradient id="redL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a60"/><stop offset="1" stop-color="#c9161f"/>
    </linearGradient>
    <linearGradient id="chromeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#dfe6ec"/><stop offset="1" stop-color="#a4afb8"/>
    </linearGradient>
    <linearGradient id="ladderG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e4ebf1"/><stop offset="1" stop-color="#94a0aa"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".95"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadowG"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="fireGlow">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ff9a2e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <!-- Bei Nacht strahlt das Feuer: heller Kern, weiter reichender Schein -->
    <radialGradient id="fireGlowNacht">
      <stop offset="0" stop-color="#fff3cf" stop-opacity=".9"/>
      <stop offset=".24" stop-color="#ffc452" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#ff8f1a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <!-- Lichtschein, den das Feuer auf die Strasse wirft -->
    <radialGradient id="feuerboden">
      <stop offset="0" stop-color="#ffb14a" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#ff8c1f" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ff7a10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#b6e3ff" stop-opacity=".95"/><stop offset="1" stop-color="#2a7fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="nightG" gradientUnits="userSpaceOnUse" x1="0" y1="-3200" x2="0" y2="520">
      <stop offset="0" stop-color="#081a3a"/><stop offset=".55" stop-color="#123055"/><stop offset="1" stop-color="#24507a"/>
    </linearGradient>
    <linearGradient id="nightFade" gradientUnits="userSpaceOnUse" x1="0" y1="500" x2="0" y2="1400">
      <stop offset="0" stop-color="#0d2242" stop-opacity="0"/><stop offset="1" stop-color="#0d2242"/>
    </linearGradient>
    <radialGradient id="moonG"><stop offset="0" stop-color="#fff8d0" stop-opacity=".85"/><stop offset="1" stop-color="#fff8d0" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunG"><stop offset="0" stop-color="#fff8d0"/><stop offset=".55" stop-color="#ffeaa0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe089" stop-opacity="0"/></radialGradient>
    <pattern id="slats" width="12" height="14" patternUnits="userSpaceOnUse">
      <rect width="12" height="9" fill="#ccd5dd"/><rect y="9" width="12" height="5" fill="#8d97a1"/>
    </pattern>
    <pattern id="rungs1" width="30" height="14" patternUnits="userSpaceOnUse">
      <rect x="12" width="7" height="14" fill="#d3dbe2"/>
    </pattern>
    <pattern id="rungs2" width="26" height="10" patternUnits="userSpaceOnUse">
      <rect x="10" width="6" height="10" fill="#d3dbe2"/>
    </pattern>
    <pattern id="rungs3" width="22" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" width="5" height="8" fill="#d3dbe2"/>
    </pattern>
    <!-- ===== Landschaft: ein Zyklus von 8000 Einheiten, wird dreimal gesetzt ===== -->
    <g id="cycle">

<!-- Busch -->
      <g transform="translate(950,520)">
        <circle cx="-26" cy="-24" r="24" fill="#3f8a52"/><circle cx="0" cy="-34" r="30" fill="#4fae6a"/>
        <circle cx="28" cy="-22" r="22" fill="#3f8a52"/>
        <rect x="-40" y="-10" width="80" height="10" rx="5" fill="#357a46"/>
      </g>
<g transform="translate(1200,520)">
        <rect x="-8" y="-72" width="16" height="72" rx="5" fill="#7a5230"/>
        <circle cx="0" cy="-118" r="46" fill="#3f8a52"/><circle cx="-34" cy="-96" r="32" fill="#357a46"/>
        <circle cx="34" cy="-96" r="32" fill="#357a46"/><circle cx="0" cy="-148" r="34" fill="#4fae6a"/>
        <circle cx="-16" cy="-130" r="14" fill="#63c795" opacity=".7"/>
      </g>
<g transform="translate(1520,520)">
        <rect x="0" y="-124" width="204" height="124" rx="4" fill="#f7ead0"/>

<script>
(function(){
  'use strict';
  var stage = document.getElementById('stage');
  var hints = document.getElementById('hints');
  var muteBtn = document.getElementById('mute');
  var SVGNS = 'http://www.w3.org/2000/svg';

  /* ================= ANSICHT (jeder Bildschirm wird ausgefüllt) ================= */
  var GROUND = 520, TRUCK_CX = 509;
  /* ---- Kindgerechte Tippflaechen ----
     Die Tippflaechen liegen in Nutzerkoordinaten. Wie gross sie auf dem
     Bildschirm ankommen, haengt am Bildausschnitt: im Hochformat schrumpft
     eine 150-Einheiten-Flaeche auf unter 30 px und ist dann kaum zu treffen.
     Deshalb merken wir uns die gezeichneten Masse und blasen jede Tippflaeche
     nach jedem Bildausschnitt so auf, dass sie mindestens TIPP_MIN Pixel in
     beiden Richtungen misst - der Mittelpunkt bleibt, wo er war. Nur
     vergroessern, nie verkleinern, damit nichts wandert.
     Der Massstab wird aus der Matrix geholt (Wurzel der Determinante), damit
     es auch fuer gedrehte Flaechen im Korb stimmt. */
  var TIPP_MIN = 46, TIPP = [];
  function tippSammeln(){
    TIPP = [];
    TIPP = [];
    [].forEach.call(document.querySelectorAll('rect[data-toggle], g[data-toggle]'), function(el){
      if (el.tagName !== 'rect'){ TIPP.push({ el: el, f: 1, x: 0, y: 0, w: 0, h: 0 }); return; }
      TIPP.push({ el: el, f: 1,
        x: parseFloat(el.getAttribute('x')) || 0,
        y: parseFloat(el.getAttribute('y')) || 0,
        w: parseFloat(el.getAttribute('width')) || 0,
        h: parseFloat(el.getAttribute('height')) || 0 });
    });
  }
  function tippSetzen(t, f){
    var w = t.w * f, h = t.h * f;
    t.el.setAttribute('x', (t.x - (w - t.w) / 2).toFixed(1));
    t.el.setAttribute('y', (t.y - (h - t.h) / 2).toFixed(1));
    t.el.setAttribute('width', w.toFixed(1));
    t.el.setAttribute('height', h.toFixed(1));
  }

  function tippGroessen(){
    TIPP.forEach(function(t){
      var el = t.el;
      if (el.tagName !== 'rect') return;      // nur Rechtecke lassen sich aufblasen
      if (!t.w || !t.h) return;
      /* inaktive Flaechen (z. B. Wasserzone ohne ausgefahrene Leiter)
         bleiben in ihrer gezeichneten Groesse */
      if (window.getComputedStyle(el).pointerEvents === 'none'){ tippSetzen(t, 1); t.f = 1; return; }
      /* Gemessene Groesse auf dem Bildschirm: gilt auch fuer Flaechen im
         gedrehten Korb, wo eine Rechnung ueber den Massstab daneben liegt.
         Aufblasen um f vergroessert die Bildschirmbox ebenfalls um f
         (lineare Abbildung), ein Durchgang genuegt also. */
      tippSetzen(t, 1);
      var b = el.getBoundingClientRect();
      if (!b.width || !b.height) return;
      var f = Math.min(2.5, Math.max(1, TIPP_MIN / Math.min(b.width, b.height)));
      t.f = f > 1.002 ? f : 1;
      if (f > 1.002) tippSetzen(t, f);
    });
  }

  /* Ein Bildausschnitt: alles zwischen x0..x1 / y0..y1 ist zu sehen, der
     Boden bleibt bei 84 % der Hoehe. Der Massstab haengt nur an der Breite. */
  function rahmen(x0, x1, y0, y1, mittig){
    var w0 = window.innerWidth, h0 = window.innerHeight;
    if (!w0 || !h0) return;
    var ar = Math.max(0.25, w0 / h0);
    var w = Math.max(x1 - x0, (y1 - y0) * ar), h = w / ar;
    if (h < y1 - y0){ h = y1 - y0; w = h * ar; }   // sehr breite Fenster
    var vx = (x0 + x1) / 2 - w/2;
    var vy = Math.min(GROUND - h * 0.84, y0 - 20); // Boden bei 84 %
    if (mittig) vy = (y0 + y1) / 2 - h/2;          // Nahaufnahme mittig
    stage.setAttribute('viewBox', vx.toFixed(1) + ' ' + vy.toFixed(1) + ' ' +
                                   w.toFixed(1) + ' ' + h.toFixed(1));
    tippGroessen();
  }

  /* Kamera: bei der Katzenrettung wird herangezoomt. Der Massstab waechst
     dadurch so weit, dass Katze und Wasserduese zwei getrennte, kindgerecht
     grosse Tippflaechen bekommen. */
  /* ---- Nahaufnahme bei der Katzenrettung ----
     Gemessen statt geschaetzt: der Rahmen wird aus den tatsaechlichen
     Positionen von Korb und Katze berechnet. So sitzt er unabhaengig von
     Fenstergroesse und Ausfahrzustand immer richtig. */
  var rettZoom = false, rettRahmen = null;

  function nahAufnahme(){
    if (!rettZoom) return;
    var inv = stage.getScreenCTM().inverse();
    var punkte = [];
    ['#korbboden', '#katze2', '.basketfig', '.waterzone rect'].forEach(function(sel){
      var el = document.querySelector(sel);
      if (!el) return;
      var b = el.getBoundingClientRect();
      if (!b.width && !b.height) return;
      var p = stage.createSVGPoint();
      [[b.x, b.y], [b.x + b.width, b.y + b.height]].forEach(function(pt){
        p.x = pt[0]; p.y = pt[1];
        var q = p.matrixTransform(inv);
        punkte.push([q.x, q.y]);
      });
    });
    if (!punkte.length) return;
    var xs = punkte.map(function(q){ return q[0]; });
    var ys = punkte.map(function(q){ return q[1]; });
    var r = 70;      // Rand, damit nichts am Bildschirmrand klebt
    rettRahmen = [Math.min.apply(null, xs) - r, Math.max.apply(null, xs) + r,
                  Math.min.apply(null, ys) - r, Math.max.apply(null, ys) + r];
    fit();
  }

  function fit(){
    // Erst nach dem Ausfahren der Leiter ist die Nahaufnahme sinnvoll.
    if (rettZoom && rettRahmen){ rahmen(rettRahmen[0], rettRahmen[1], rettRahmen[2], rettRahmen[3], true); return; }
    if (window.innerHeight >= window.innerWidth){
      rahmen(-620, 1290, -560, 660);   // links Platz fuer Duese, Strahl und Feuerwehrhaus
    } else {
      // Querformat: der ausgefahrene Korb liegt bei y ~ -520, die Baumkrone
      // reicht noch hoeher. y0 muss beides fassen, sonst schneidet der
      // Bildausschnitt den Korb ab.
      rahmen(-650, 1420, -700, 660);
    }
  }
  tippSammeln();
  fit();
  window.addEventListener('resize', function(){ fit(); if (hints.childNodes.length) renderHints(); });
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 250); });

  /* ================= TON ================= */
  var AC = null, master = null, muted = false;
  var loops = { water: null, drive: null, hose: null, hosewater: null };
  var siren = { on:false, osc:null, g:null, timer:null, hi:false };

  function unlockAudio(){
    if (!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended' && AC.resume) AC.resume();
  }
  function nbuf(sec){
    var n = Math.max(1, Math.floor(AC.sampleRate * sec));
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function beep(f, dur, vol){
    if (!AC) return;
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function sweep(o){
    if (!AC) return;
    var t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = nbuf(o.dur);
    f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, o.f1), t + o.dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + o.dur + 0.05);
  }
  function sfxWhirr(){
    if (!AC) return;
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = 4;
    o.frequency.setValueAtTime(72, t); o.frequency.linearRampToValueAtTime(138, t + 1.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.085, t + 0.2);
    g.gain.setValueAtTime(0.085, t + 1.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.45);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 1.5);
    sweep({ f0: 1600, f1: 420, dur: 1.25, vol: 0.045, q: 0.9 });
    setTimeout(function(){ sweep({ f0: 900, f1: 150, dur: 0.1, vol: 0.13, q: 1 }); }, 1240);
  }
  function sfxDoor(open){
    sweep({ f0: open ? 320 : 700, f1: open ? 900 : 260, dur: 0.45, vol: 0.06, q: 2 });
    setTimeout(function(){ sweep({ f0: 640, f1: 140, dur: 0.1, vol: 0.13, q: 1 }); }, open ? 380 : 300);
  }
  function sfxRoll(){
    for (var i = 0; i < 8; i++){
      (function(i){
        setTimeout(function(){ sweep({ f0: 800 + i * 60, f1: 380, dur: 0.07, vol: 0.055, q: 1.4 }); }, i * 76);
      })(i);
    }
    setTimeout(function(){ sweep({ f0: 560, f1: 130, dur: 0.12, vol: 0.13, q: 1 }); }, 660);
  }
  function sirenStart(){
    if (!AC || siren.on) return;
    siren.on = true; siren.hi = false;
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 440;
    f.type = 'lowpass'; f.frequency.value = 1700; f.Q.value = 1;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.11, t + 0.25);
    o.connect(f); f.connect(g); g.connect(master); o.start(t);
    siren.osc = o; siren.g = g;
    siren.timer = setInterval(function(){
      if (!AC || !siren.osc) return;
      siren.hi = !siren.hi;
      var tt = AC.currentTime, cur = siren.osc.frequency.value;
      siren.osc.frequency.cancelScheduledValues(tt);
      siren.osc.frequency.setValueAtTime(cur, tt);
      siren.osc.frequency.linearRampToValueAtTime(siren.hi ? 587 : 440, tt + 0.22);
    }, 640);
  }
  function sirenStop(){
    if (!siren.on) return;
    siren.on = false;
    clearInterval(siren.timer); siren.timer = null;
    var o = siren.osc, g = siren.g;
    siren.osc = null; siren.g = null;
    if (!AC || !o) return;
    var t = AC.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.2);
    try { o.stop(t + 0.25); } catch (e) {}
  }
  function waterStart(){
    if (!AC || loops.water) return;
    var t = AC.currentTime;
    var s = AC.createBufferSource(); s.buffer = nbuf(2); s.loop = true;
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 0.7;
    var g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.1, t + 0.2);
    var lfo = AC.createOscillator(); lfo.frequency.value = 0.4;
    var lg = AC.createGain(); lg.gain.value = 450;
    lfo.connect(lg); lg.connect(f.frequency);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); lfo.start(t);
    loops.water = { s:s, g:g, lfo:lfo };
  }
  function waterStop(){
    if (!loops.water || !AC) return;
    var w = loops.water, t = AC.currentTime;
    loops.water = null;
    w.g.gain.cancelScheduledValues(t);
    w.g.gain.setValueAtTime(w.g.gain.value, t);
    w.g.gain.linearRampToValueAtTime(0.0001, t + 0.15);
    try { w.s.stop(t + 0.2); w.lfo.stop(t + 0.2); } catch (e) {}
  }
  /* Schlauch spritzt: kraeftiges Zischen, eigenstaendiger Loop */
  function hoseStart(){
    if (!AC || loops.hose) return;
    var t = AC.currentTime;
    var s = AC.createBufferSource(); s.buffer = nbuf(2); s.loop = true;
    var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 950; bp.Q.value = 0.55;
    var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 320;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.25);
    var lfo = AC.createOscillator(); lfo.frequency.value = 5.5;   // schnelles Zischen
    var lg = AC.createGain(); lg.gain.value = 280;
    lfo.connect(lg); lg.connect(bp.frequency);
    s.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
    s.start(t); lfo.start(t);
    loops.hose = { s:s, g:g, lfo:lfo };
  }
  function hoseStop(){
    if (!loops.hose || !AC) return;
    var w = loops.hose, t = AC.currentTime;
    loops.hose = null;
    w.g.gain.cancelScheduledValues(t);
    w.g.gain.setValueAtTime(w.g.gain.value, t);
    w.g.gain.linearRampToValueAtTime(0.0001, t + 0.2);
    try { w.s.stop(t + 0.25); w.lfo.stop(t + 0.25); } catch (e) {}
  }
  /* Schlauch in der Hand: Maennchen angetippt UND Rollo offen */
  function syncHose(){
    var should = state.figure && state.shutter;
    if (should && !loops.hose) hoseStart();
    else if (!should && loops.hose) hoseStop();
    // ohne Schlauch in der Hand gibt es keinen Strahl
    if (!should && state.hosewater){
      state.hosewater = false;
      stage.classList.remove('hosewater-on');
      hoseSprayStop();
    }
  }
  /* Strahl am Heck auf- und zudrehen */
  function hoseSprayStart(){
    if (!AC || loops.hosewater) return;
    var t = AC.currentTime;
    var s = AC.createBufferSource(); s.buffer = nbuf(2); s.loop = true;
    var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.6;
    var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    var g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.17, t + 0.18);
    s.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
    s.start(t);
    loops.hosewater = { s:s, g:g };
  }
  function hoseSprayStop(){
    if (!loops.hosewater || !AC) return;
    var w = loops.hosewater, t = AC.currentTime;
    loops.hosewater = null;
    w.g.gain.cancelScheduledValues(t);
    w.g.gain.setValueAtTime(w.g.gain.value, t);
    w.g.gain.linearRampToValueAtTime(0.0001, t + 0.2);
    try { w.s.stop(t + 0.25); } catch (e) {}
  }
  function driveStart(){
    if (!AC || loops.drive) return;
    var t = AC.currentTime;
    var s = AC.createBufferSource(); s.buffer = nbuf(2); s.loop = true;
    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    var g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.3);
    s.connect(lp); lp.connect(g); g.connect(master);
    var o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 56;
    var of = AC.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 190;
    var og = AC.createGain(); og.gain.setValueAtTime(0.0001, t);
    og.gain.linearRampToValueAtTime(0.05, t + 0.3);
    o.connect(of); of.connect(og); og.connect(master);
    s.start(t); o.start(t);
    loops.drive = { s:s, g:g, o:o, og:og };
  }
  function driveStop(){
    if (!loops.drive || !AC) return;
    var d = loops.drive, t = AC.currentTime;
    loops.drive = null;
    [d.g, d.og].forEach(function(g){
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.25);
    });
    try { d.s.stop(t + 0.3); d.o.stop(t + 0.3); } catch (e) {}
  }

  /* ================= SCHALTEN ================= */
  var state = { ladder:false, lights:false, siren:false, door:false,
                shutter:false, headlights:false, drive:false, water:false, figure:false,
                hosewater:false, katze:false };
  var cls = { ladder:'ladder-out', lights:'lights-on', siren:'siren-on', door:'door-open',
              shutter:'shutter-open', headlights:'headlight-on', drive:'driving', water:'water-on',
              figure:'figure-on', hosewater:'hosewater-on', katze:'katze-korb' };

  /* ---------- Fahrt: Landschaft zieht vorbei ----------
     Eine Zykluslaenge sind 8000 Einheiten. Der Wagen faehrt hin, dreht am
     Feuerwehrhaus um und faehrt zurueck. Die Bewegung rechnet ein Timer in
     Bildern, damit Anhalten exakt einfriert und Weiterfahren dort ansetzt. */
  var LAND_SPAN = 8000, LAND_SECONDS = 60;
  var LAND_SPEED = LAND_SPAN / LAND_SECONDS;       // Einheiten pro Sekunde
  var landOffset = 0;                              // 0 bis -8000 (Hinfahrt)
  /* Kein Umdrehen: der Wagen faehrt immer vorwaerts, am Ende beginnt die Runde neu. */
  var landRAF = null, landLast = 0;

  function landApply(){
    document.getElementById('landscroll').style.transform =
      'translate(' + landOffset.toFixed(2) + 'px,0)';
  }
  /* Aktuelle Position aus dem DOM lesen und mit dem Zaehler abgleichen.
     So kann die Position nie auseinanderlaufen, egal wer sie gesetzt hat. */
  function landRead(){
    var m = getComputedStyle(document.getElementById('landscroll')).transform;
    if (m && m !== 'none'){
      var p = m.match(/matrix\(([^)]+)\)/);
      if (p) landOffset = parseFloat(p[1].split(',')[4]) || 0;
    }
    return landOffset;
  }
  function landStop(){
    if (landRAF){ cancelAnimationFrame(landRAF); landRAF = null; }
    landLast = 0;
  }
  function landStep(ts){
    if (!landLast){ landLast = ts; landRAF = requestAnimationFrame(landStep); return; }
    var dt = Math.min(0.1, (ts - landLast) / 1000);
    landLast = ts;
    var vorher = landOffset;
    landOffset -= LAND_SPEED * dt;                 // immer vorwaerts

    /* An einer brennenden Stelle haelt der Wagen an. */
    var halte = brandZoneVoraus(vorher, landOffset);
    if (halte !== null){
      landOffset = halte; landApply(); haltAmBrand(halte); return;
    }

    if (landOffset <= -LAND_SPAN){                 // Runde geschafft: neu beginnen
      landOffset += LAND_SPAN;
      if (landOffset > 0) landOffset = 0;
      landApply();
      newLap();                                    // frische Strecke: es brennt wieder
      landRAF = requestAnimationFrame(landStep);
      return;
    }
    landApply();
    landRAF = requestAnimationFrame(landStep);
  }
  function landRun(){ landStop(); landRead(); landRAF = requestAnimationFrame(landStep); }
  function landFreeze(){ landStop(); landApply(); }
  function landReset(){
    landStop();
    landOffset = 0; landApply();
  }

  /* ================= BRAENDE =================
     Zwei Brandstellen auf der Strecke. Der Wagen haelt dort an.
     Geloescht wird nur mit dem richtigen Mittel: die Tanne mit dem Schlauch
     vom Heck, das Hochhaus mit der Leiter von oben. Erst danach geht es weiter. */
  var FIRE_A = 2100, FIRE_B = 4340, RETT_X = 5925;
  var BRAND = {
    A: { stopAt: -(FIRE_A + 300), hint: 'Schlauch',
         extinguish: function(){ return state.figure && state.shutter && state.hosewater; } },
    /* Der Wagen faehrt nach rechts: "vor dem Hochhaus halten" heisst, dass das
       Haus noch vor ihm steht. Linke Kante des Hauses landet bei ~1000. */
    B: { stopAt: -(FIRE_B - 1000), hint: 'Leiter',
         extinguish: function(){ return state.ladder && state.water; } }
  };
  var currentFire = null;      // 'A' | 'B' | null
  var firesOut = { A:false, B:false };
  var arrived = false;         // steht der Wagen an einer Brandstelle?

  /* ---------- Rettung: die Katze im Baum hinter dem Hochhaus ----------
     Ablauf: Wagen haelt vor dem Baum, Leiter ausfahren, Katze antippen
     (springt in den Korb), Leiter einfahren (Korb kommt herunter), dann
     springt die Katze aus dem Korb auf die Strasse und laeuft weg.
     Wird die Wasserdüse eingeschaltet, verkriecht sie sich in der Krone. */
  var RETT_Y = -540;           // Hoehe der Katze im Baum (Landschaft)
  var AST_X = 6195;            // wo sie auf dem Ast sitzt (etwas neben dem Korb)
  var rettung = {
    /* Der Baum steht bewusst weit HINTER dem Hochhaus (FIRE_B = 4340):
       erst dort loeschen, dann weiterfahren, dann erst kommt der Baum.
       Der Korb liegt bei stehendem Wagen in Nutzerkoordinaten fest, die
       Katze sitzt bei AST_X - der Haltepunkt ist die Differenz daraus. */
    stopAt: -5605,
    phase: 'none',             // none | warte | imkorb | unten | weg
    katzeImKorb: false,
    timers: []
  };
  var rettDone = false;        // Katze gerettet?

  function fireOpen(k){ return !firesOut[k]; }

  /* Wird in diesem Bild eine Brandstelle ueberfahren? Dann dort exakt halten. */
  function brandZoneVoraus(vorher, nachher){
    for (var k in BRAND){
      if (!fireOpen(k)) continue;
      var z = BRAND[k].stopAt;
      if (vorher > z && nachher <= z) return z;
    }
    // Rettungsstelle: dieselbe Pruefung
    if (!rettDone){
      var z2 = rettung.stopAt;
      if (vorher > z2 && nachher <= z2) return z2;
    }
    return null;
  }

  /* Hinweisring an der Brandstelle, die jetzt dran ist */
  function fireHint(k){
    var w = document.getElementById('warn');
    while (w.firstChild) w.removeChild(w.firstChild);
    if (!k){ w.style.opacity = '0'; return; }
    var ziel = document.getElementById(k === 'A' ? 'fireA' : 'fireB');
    if (!ziel) return;
    var r = ziel.getBoundingClientRect();
    if (r.width < 4) return;
    var q = toSvg(r.x + r.width / 2, r.y + r.height * 0.55);
    var c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('class', 'firehint');
    c.setAttribute('cx', q.x); c.setAttribute('cy', q.y); c.setAttribute('r', 90);
    w.appendChild(c);
    w.style.opacity = '1';
    clearTimeout(warn._t);
    warn._t = setTimeout(function(){ w.style.opacity = '0'; }, 2800);
  }

  /* Angekommen: Wagen steht, jetzt muss geloescht werden */
  function haltAmBrand(z){
    for (var k in BRAND){
      if (fireOpen(k) && Math.abs(BRAND[k].stopAt - z) < 1){ currentFire = k; break; }
    }
    // Rettungsstelle erreicht?
    if (!currentFire && !rettDone && Math.abs(rettung.stopAt - z) < 1){
      rettung.phase = 'warte';
      stage.classList.add('katze-wartet');
      katzeVerschieben();
      tippGroessen();
    }
    arrived = true;
    state.drive = false;
    stage.classList.remove('driving');
    driveStop();
    landStop();
    if (AC){ beep(880, 0.12, 0.06); setTimeout(function(){ beep(660, 0.16, 0.05); }, 150); }
    fireHint(currentFire);
    if (!currentFire) katzeHinweis();
  }

  /* Hinweisring auf der Katze, solange sie noch gerettet werden muss */
  function katzeHinweis(){
    var w = document.getElementById('warn');
    while (w.firstChild) w.removeChild(w.firstChild);
    if (rettDone || rettung.phase !== 'warte'){ w.style.opacity = '0'; return; }
    /* Der Ring sitzt auf der Katze, die gerade zu sehen ist: im Baum auf
       #katze, im Korb auf #katze2. */
    var el = rettung.katzeImKorb ? document.getElementById('katze2')
                                 : document.getElementById('katze');
    if (!el) return;
    var r = el.getBoundingClientRect();
    if (r.width < 4) return;
    var q = toSvg(r.x + r.width / 2, r.y + r.height * 0.45);
    var c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('class', 'firehint');
    c.setAttribute('cx', q.x); c.setAttribute('cy', q.y); c.setAttribute('r', 70);
    w.appendChild(c);
    w.style.opacity = '1';
    clearTimeout(warn._t);
    warn._t = setTimeout(function(){ w.style.opacity = '0'; }, 2800);
  }

  /* Neue Runde: an beiden Stellen brennt es wieder */
  function newLap(){
    firesOut.A = false; firesOut.B = false;
    currentFire = null; arrived = false;
    rettZoom = false; rettRahmen = null; fit();   // normale Ansicht
    // Katze sitzt wieder im Baum und muss erneut gerettet werden
    rettDone = false;
    rettung.phase = 'none'; rettung.katzeImKorb = false;
    rettung.timers.forEach(clearTimeout); rettung.timers = [];
    stage.classList.remove('katze-korb', 'katze-springt', 'katze-laeuft', 'katze-weg', 'katze-versteckt');
    document.getElementById('katze').setAttribute('transform', 'translate(' + AST_X + ',' + RETT_Y + ')');
    document.getElementById('katze').style.opacity = '';
    katzeZuruecksetzen();
    stage.classList.remove('fireA-out', 'fireB-out');
    fireHint(null);
  }

  /* ---------- Rettung: die einzelnen Schritte ---------- */
  /* Katze springt in den Korb (Leiter muss ausgefahren sein) */
  function katzeInKorb(){
    if (rettDone || rettung.katzeImKorb) return;
    if (!state.ladder){ beepNope(); warn(['ladder']); katzeHinweis(); return; }
    rettung.katzeImKorb = true;
    rettung.phase = 'imkorb';
    katzeZuruecksetzen();
    stage.classList.remove('katze-wartet');
    stage.classList.add('katze-korb');
    katzeVerschieben();
    tippGroessen();
    rettung.timers.push(setTimeout(nahAufnahme, 1000));   // Katze sitzt jetzt anders
    if (AC){ beep(1100, 0.09, 0.055); setTimeout(function(){ beep(1500, 0.11, 0.05); }, 130); }
    katzeHinweis();
  }

  /* ---------- Die Katze: im Baum und im Korb ----------
     Zwei Zeichnungen:
       #katze  sitzt im Baum, in Landschaftskoordinaten (faehrt mit dem Baum)
       #katze2 sitzt IM Korb und ist Kind von .basket - dadurch faehrt sie
               beim Ein- und Ausfahren von selbst mit
     #katzehit ist die gemeinsame Tippflaeche in Nutzerkoordinaten. */
  function katzeVerschieben(){
    var el  = document.getElementById('katze');
    var k2  = document.getElementById('katze2');
    var hit = document.getElementById('katzehit');

    el.setAttribute('transform', 'translate(' + AST_X + ',' + RETT_Y + ')');
    if (!hit) return;

    /* Die Tippflaeche wird an die Katze gesetzt, die gerade zu sehen ist -
       am gezeichneten Tier GEMESSEN, nicht gerechnet. Der Korb steht naemlich
       je nach Bildschirmausrichtung voellig anders: im Querformat ist die
       Leiter flacher, der Korb liegt rund 300 Einheiten weiter rechts und
       230 tiefer als im Hochformat. Feste Zahlen sassen nur im Hochformat;
       im Querformat sass die Katze dadurch in der Baumkrone. */
    var ziel = (rettung.katzeImKorb && k2) ? k2 : el;
    var r = ziel.getBoundingClientRect();
    var ctm = stage.getScreenCTM();
    if ((!r.width && !r.height) || !ctm) return;
    var p = stage.createSVGPoint();
    p.x = r.x + r.width / 2;
    p.y = r.y + r.height * 0.55;
    var q = p.matrixTransform(ctm.inverse());
    hit.setAttribute('transform', 'translate(' + q.x.toFixed(1) + ',' + q.y.toFixed(1) + ')');
  }

  /* Bringt die Korbkatze in ihre Ausgangslage. Ohne das traegt sie den
     Inline-Transform des letzten Sprungs in die naechste Runde mit. */
  function katzeZuruecksetzen(){
    var h = document.querySelector('#katze2 .katzehide');
    if (!h) return;
    h.style.transition = 'none';
    h.style.transform = 'none';
    requestAnimationFrame(function(){ h.style.transition = ''; });
  }

  /* Leiter eingefahren und Katze im Korb: sie springt auf die Strasse und
     laeuft weg. Die Sprunghoehe wird GEMESSEN - von den Fuessen der
     Korbkatze bis zum Strassenbelag. Frueher stand hier ein fester Wert
     (1032): der stimmte nur, solange die Katze nahe am Leiterkopf sass,
     im Querformat fiel sie dadurch scheinbar vom Baum. */
  function katzeSpringtRaus(){
    if (!rettung.katzeImKorb || rettDone) return;
    stage.classList.remove('katze-korb');
    stage.classList.add('katze-springt');
    rettung.phase = 'unten';

    var k2   = document.getElementById('katze2');
    var hide = k2 && k2.querySelector('.katzehide');
    var dx = -52, fall = 1032;                   // Notnagel: Hochformat
    if (k2 && hide){
      var r0 = hide.getBoundingClientRect();
      if (r0.width || r0.height){
        var p0 = stage.createSVGPoint();
        p0.x = r0.x + r0.width / 2; p0.y = r0.y + r0.height;   // Fusslinie
        var fuss = p0.matrixTransform(stage.getScreenCTM().inverse());
        fall = Math.round(GROUND - fuss.y);
      }
    }
    function setz(tr, sec, ease){
      if (!hide) return;
      hide.style.transition = 'transform ' + sec + 's ' + ease;
      hide.style.transform = tr;
    }

    setz('translate(' + dx + 'px,' + fall + 'px)', 0.8, 'cubic-bezier(.45,0,.85,.5)');
    rettung.timers.push(setTimeout(function(){
      setz('translate(' + (dx - 6) + 'px,' + (fall - 40) + 'px)', 0.18, 'ease-out');
      rettung.timers.push(setTimeout(function(){
        setz('translate(' + (dx - 10) + 'px,' + fall + 'px)', 0.16, 'ease-in');
      }, 195));
    }, 830));

    rettung.timers.push(setTimeout(function(){
      stage.classList.add('katze-laeuft');
      rettung.phase = 'weg';
      setz('translate(' + (dx + 1052) + 'px,' + fall + 'px)', 1.7, 'cubic-bezier(.3,.1,.75,.4)');
      if (AC){ beep(1300, 0.08, 0.05); setTimeout(function(){ beep(900, 0.1, 0.045); }, 120); }
      rettung.timers.push(setTimeout(function(){
        rettDone = true;
        stage.classList.remove('katze-springt', 'katze-laeuft');
        stage.classList.add('katze-weg');
        rettung.phase = 'weg';
      }, 2200));
    }, 1150));
  }

  /* Ist das Feuer jetzt geloescht? */
  function checkExtinguish(){
    if (!currentFire || !arrived) return;
    if (!BRAND[currentFire].extinguish()) return;
    firesOut[currentFire] = true;
    stage.classList.add('fire' + currentFire + '-out');
    if (AC){
      sweep({ f0: 2400, f1: 380, dur: 1.1, vol: 0.11, q: 0.7 });
      setTimeout(function(){ beep(520, 0.14, 0.06); }, 900);
    }
    currentFire = null;
    fireHint(null);
  }

  /* ---------- Fahr-Sperre ----------
     Losfahren darf der Wagen nur, wenn die Leiter eingefahren, die Fahrertuer
     geschlossen, beide Rollaeden zu sind und das Maennchen stillsteht und sich
     festhaelt (also nicht angetippt ist). */
  var BLOCK = {
    ladder:     'Leiter einfahren',
    door:       'Tuer schliessen',
    shutter:    'Rollaeden schliessen',
    figure:     'Maennchen festhalten'
  };
  function blockers(){
    var out = [];
    for (var k in BLOCK) if (state[k]) out.push(k);
    return out;
  }
  function beepNope(){
    if (!AC) return;
    beep(300, 0.11, 0.09);
    setTimeout(function(){ beep(220, 0.16, 0.08); }, 130);
  }
  // Welches Element markiert eine blockierende Bedingung?
  var WARN_SEL = {
    ladder:  '[data-toggle="ladder"]',
    door:    '[data-toggle="door"]',
    shutter: '[data-toggle="shutter"]',
    figure:  '.groundfig [data-toggle="figure"]'   // das Maennchen am Heck, nicht das im Korb
  };
  function warn(keys){
    var w = document.getElementById('warn');
    while (w.firstChild) w.removeChild(w.firstChild);
    keys.forEach(function(k){
      var el = document.querySelector(WARN_SEL[k] || ('[data-toggle="' + k + '"]'));
      if (!el) return;
      var r = el.getBoundingClientRect();
      if (r.width < 4) return;
      var q = toSvg(r.x + r.width / 2, r.y + r.height / 2);
      // dunkler Rand zuerst, damit der Ring auf rotem Blech lesbar bleibt
      var dark = document.createElementNS(SVGNS, 'circle');
      dark.setAttribute('class', 'warn-ring warn-dark');
      dark.setAttribute('cx', q.x); dark.setAttribute('cy', q.y); dark.setAttribute('r', 74);
      w.appendChild(dark);
      var c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('class', 'warn-ring');
      c.setAttribute('cx', q.x); c.setAttribute('cy', q.y);
      c.setAttribute('r', 70);
      w.appendChild(c);
    });
    w.style.opacity = '1';
    clearTimeout(warn._t);
    warn._t = setTimeout(function(){ w.style.opacity = '0'; }, 2200);
  }
  function clearWarn(){
    var w = document.getElementById('warn');
    while (w.firstChild) w.removeChild(w.firstChild);
    w.style.opacity = '0';
  }
  function nope(){
    stage.classList.remove('nope');
    void stage.offsetWidth;                  // Neustart der Animation erzwingen
    stage.classList.add('nope');
    clearTimeout(nope._t);
    nope._t = setTimeout(function(){ stage.classList.remove('nope'); }, 620);
    beepNope();
    warn(blockers());
  }

  function toggle(key){
    var on = state[key] = !state[key];
    // Losfahren nur bei freier Fahrt
    if (key === 'drive' && on){
      // Erst loeschen, dann weiterfahren
      if (arrived && currentFire){
        state.drive = false;
        beepNope();
        fireHint(currentFire);
        return;
      }
      // An der Rettungsstelle: erst wenn die Katze gerettet ist
      if (arrived && !currentFire && !rettDone && rettung.phase !== 'none'){
        state.drive = false;
        beepNope();
        katzeHinweis();
        return;
      }
      if (blockers().length){
        state.drive = false;
        nope();
        syncHose();
        return;
      }
      clearWarn();                                   // freie Fahrt
    }
    if (key !== 'katze') stage.classList.toggle(cls[key], on);
    tippGroessen();          // Tippbarkeit hat sich geaendert: neu einpassen
    switch (key){
      case 'ladder':
        sfxWhirr();
        if (on && !rettDone && rettung.phase === 'warte'){
          // Leiter faehrt zur Katze aus: nach der Bewegung heranzoomen
          rettung.timers.push(setTimeout(function(){
            rettZoom = true; nahAufnahme();
          }, 1650));
        }
        if (!on){                                      // eingefahren: normale Ansicht
          rettZoom = false; rettRahmen = null; fit();
        }
        if (!on && state.water){                       // Leiter eingefahren = Wasser aus
          state.water = false; stage.classList.remove('water-on'); waterStop();
          stage.classList.remove('katze-versteckt');   // Wasser aus: Katze kommt hervor
        }
        // Leiter eingefahren und Katze im Korb: sie springt heraus und laeuft weg
        if (!on && rettung.katzeImKorb && !rettDone){
          rettung.timers.push(setTimeout(katzeSpringtRaus, 1500));
        }
        break;
      case 'lights': beep(on ? 1180 : 640, 0.08, 0.05); break;
      case 'siren':
        // Sirene: Ton an- und wieder ausschalten
        if (on) sirenStart(); else sirenStop();
        break;
      case 'door': sfxDoor(on); break;
      case 'shutter': sfxRoll(); break;
      case 'headlights': beep(on ? 760 : 520, 0.07, 0.05); break;
      case 'figure':
        if (on){
          if (state.shutter){                        // Rollo offen: Schlauch von der Rolle nehmen
            sweep({ f0: 1500, f1: 260, dur: 0.38, vol: 0.085, q: 1.2 });
            setTimeout(function(){ beep(760, 0.09, 0.05); }, 300);
          } else { beep(880, 0.09, 0.05); setTimeout(function(){ beep(1320, 0.12, 0.045); }, 130); }
        } else beep(660, 0.09, 0.045);
        break;
      case 'drive':
        if (on){ driveStart(); landRun(); }
        else { driveStop(); landFreeze(); }
        break;
      case 'water':
        if (on){
          waterStart();
          if (!state.ladder){                          // ohne ausgefahrene Leiter geht das nicht
            state.ladder = true; stage.classList.add('ladder-out'); sfxWhirr();
          }
          // Die Katze erschrickt vor dem Wasser und verkriecht sich
          if (!rettDone && !rettung.katzeImKorb && rettung.phase !== 'none'){
            stage.classList.add('katze-versteckt');
            stage.classList.remove('katze-wartet');
          }
        } else {
          waterStop();
          // Wasser aus: die Katze kommt wieder hervor
          stage.classList.remove('katze-versteckt');
          if (!rettDone && !rettung.katzeImKorb && rettung.phase === 'warte'){
            stage.classList.add('katze-wartet');
            katzeVerschieben();
          }
        }
        break;
      case 'hosewater':
        if (on) hoseSprayStart(); else hoseSprayStop();
        break;
      case 'katze': katzeInKorb(); break;
    }
    // Waehrend der Fahrt: sobald eine Bedingung verletzt wird, haelt der Wagen an
    if (state.drive && blockers().length){
      state.drive = false;
      stage.classList.remove('driving');
      driveStop();
      landFreeze();
      beepNope();
      warn(blockers());
    }
    syncHose();
    checkExtinguish();
    // Leiter ausgefahren + Katze wartet: die Katze sitzt im Korb bereit
    if (rettung.phase === 'warte' && rettung.katzeImKorb) katzeVerschieben();
  }

  /* Welche Tippflaeche ist gemeint?
     Die Tippflaechen werden vergroessert, damit sie auch auf kleinen
     Bildschirmen gut zu treffen sind - dadurch koennen sie einander
     ueberlappen (z. B. die aufgeblasene Leiterflaeche und die Rollaeden
     darunter). Deshalb entscheidet nicht die Zeichenreihenfolge, sondern
     wie gut der Finger zur URSPRUENGLICH gezeichneten Flaeche passt.
     Mass dafuer ist der Abstand zur Originalmitte, geteilt durch die
     kleinere Originalkante: genau dort ist die Flaeche am "eigensten".
     So gewinnt bei einem Tipp auf die Leiter die Leiter, bei einem Tipp
     auf den Rolladen der Rolladen - ohne feste Rangliste. */
  function bestTarget(cx, cy){
    var liste = [];
    [].forEach.call(document.querySelectorAll('rect[data-toggle]'), function(el){
      if (getComputedStyle(el).pointerEvents === 'none') return;
      var r = el.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return;
      if (cx < r.x || cx > r.x + r.width || cy < r.y || cy > r.y + r.height) return;
      var t = null;
      for (var i = 0; i < TIPP.length; i++) if (TIPP[i].el === el){ t = TIPP[i]; break; }
      var f = t ? t.f : 1;
      var ow = r.width / f, oh = r.height / f;          // Originalgroesse
      var d = Math.hypot(cx - (r.x + r.width/2), cy - (r.y + r.height/2));
      liste.push({ el: el, s: d / Math.max(1, Math.min(ow, oh)) });
    });
    /* Zusaetzlich nicht-Rechteck-Ziele (z. B. die Katze) mitzaehlen */
    [].forEach.call(document.querySelectorAll('g[data-toggle]'), function(el){
      if (getComputedStyle(el).pointerEvents === 'none') return;
      var r = el.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return;
      if (cx < r.x || cx > r.x + r.width || cy < r.y || cy > r.y + r.height) return;
      var d = Math.hypot(cx - (r.x + r.width/2), cy - (r.y + r.height/2));
      liste.push({ el: el, s: d / Math.max(1, Math.min(r.width, r.height)) });
    });
    if (!liste.length) return null;
    liste.sort(function(a, b){ return a.s - b.s; });
    return liste[0].el;
  }
  function targetOf(node){
    while (node && node !== stage){
      if (node.getAttribute && node.getAttribute('data-toggle')) return node;
      node = node.parentNode;
    }
    return null;
  }
  function onPress(e){
    if (e.target === muteBtn) return;
    unlockAudio();
    scheduleIdle();
    var el = null;
    if (typeof e.clientX === 'number' && e.clientX !== undefined) el = bestTarget(e.clientX, e.clientY);
    if (!el) el = targetOf(e.target);
    if (!el) return;
    if (e.cancelable) e.preventDefault();
    toggle(el.getAttribute('data-toggle'));
  }
  if (window.PointerEvent) stage.addEventListener('pointerdown', onPress, { passive:false });
  else {
    stage.addEventListener('touchstart', function(e){
      var t = e.changedTouches && e.changedTouches[0];
      onPress({ target: t && document.elementFromPoint(t.clientX, t.clientY),
                clientX: t ? t.clientX : undefined, clientY: t ? t.clientY : undefined,
                cancelable:true, preventDefault: function(){ e.preventDefault(); } });
    }, { passive:false });
    stage.addEventListener('mousedown', onPress, { passive:false });
  }
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

  /* ================= HINWEIS-RINGE (verschwinden beim ersten Tippen) ================= */
  // Bildschirmkoordinaten -> SVG-Koordinaten (berücksichtigt CSS-Transformationen)
  function toSvg(clientX, clientY){
    var q = stage.createSVGPoint();
    q.x = clientX; q.y = clientY;
    return q.matrixTransform(stage.getScreenCTM().inverse());
  }
  function renderHints(){
    while (hints.firstChild) hints.removeChild(hints.firstChild);
    var seen = [];
    var list = document.querySelectorAll('[data-hint]');
    for (var i = 0; i < list.length; i++){
      var el = list[i];
      if (getComputedStyle(el).pointerEvents === 'none') continue;   // gerade nicht tippbar
      var r = el.getBoundingClientRect();                            // echte Lage inkl. Animation
      if (!r || r.width < 8 || r.height < 8) continue;
      var q = toSvg(r.x + r.width / 2, r.y + r.height / 2);
      var dup = false;
      for (var j = 0; j < seen.length; j++){
        var box = seen[j].box;
        if (Math.hypot(seen[j].x - q.x, seen[j].y - q.y) < 100){ dup = true; break; }
      }
      if (dup) continue;
      seen.push({ x:q.x, y:q.y, box:[r.x, r.y, r.x + r.width, r.y + r.height] });
    }
    seen.forEach(function(h){
      var c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('class', 'hint-ring');
      c.setAttribute('cx', h.x); c.setAttribute('cy', h.y); c.setAttribute('r', 54);
      hints.appendChild(c);
      var d = document.createElementNS(SVGNS, 'circle');
      d.setAttribute('class', 'hint-dot');
      d.setAttribute('cx', h.x); d.setAttribute('cy', h.y); d.setAttribute('r', 13);
      hints.appendChild(d);
    });
  }
  var hintTimer = null, idleTimer = null;
  function showHints(ms){
    renderHints();
    hints.style.opacity = '1';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ hints.style.opacity = '0'; }, ms || 8000);
  }
  function scheduleIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ showHints(7000); }, 25000);
  }
  setTimeout(function(){ showHints(9000); }, 1300);
  scheduleIdle();

  /* ================= TON-KNOPF ================= */
  muteBtn.addEventListener('click', function(e){
    e.stopPropagation();
    unlockAudio();
    muted = !muted;
    if (master && AC) master.gain.setTargetAtTime(muted ? 0 : 0.6, AC.currentTime, 0.05);
    muteBtn.setAttribute('aria-label', muted ? 'Ton an' : 'Ton aus');
    muteBtn.querySelector('.slash').style.display = muted ? '' : 'none';
    muteBtn.querySelector('.snd1').style.display = muted ? 'none' : '';
    muteBtn.querySelector('.snd2').style.display = muted ? 'none' : '';
  });
})();
</script>
</body>
